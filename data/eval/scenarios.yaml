# EVA Evaluation Dataset — 50 scenarios
# Customer: Arman Hossain / NexaFlow Technologies (c63d2f89-9aa3-4157-8205-a7d6cfc23207)
#
# Schema per scenario:
#   id                      unique identifier
#   category                billing | subscription | refund_requests | product_problems | account_access
#   query                   the user question sent to EVA
#   expected_tools          tools EVA must call (recall check)
#   answer_must_contain     at least ONE of these keywords must appear in the response
#   answer_must_not_contain ALL of these phrases must be absent (hallucination check)
#   min_confidence          minimum acceptable reasoning_trace.confidence
#   expected_reasoning_type expected reasoning_trace.reasoning_type

# ── BILLING (10) ──────────────────────────────────────────────────────────────

- id: BIL-001
  category: billing
  query: "Why was I charged twice in March 2026?"
  expected_tools:
    - get_billing_history
  answer_must_contain:
    - "duplicate"
    - "twice"
    - "March"
  answer_must_not_contain:
    - "no record"
    - "cannot find"
  min_confidence: 0.7
  expected_reasoning_type: root_cause_analysis

- id: BIL-002
