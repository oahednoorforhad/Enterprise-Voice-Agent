name: Build and Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/eva-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/eva-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            VITE_API_URL=https://${{ secrets.DOMAIN }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH key
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          SSH_KEY_B64: ${{ secrets.DROPLET_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$SSH_KEY_B64" ]; then
            echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          else
            echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          echo "Key first line: $(head -1 ~/.ssh/id_ed25519)"

      - name: Deploy to Droplet
        shell: bash
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DOCKER_COMPOSE_FILE: docker/docker-compose.prod.yml
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
              -i ~/.ssh/id_ed25519 \
              root@"$DROPLET_HOST" "
            cd /opt/eva &&
            set -a && source .env.prod && set +a &&
            echo '[$(date -Iseconds)] Pulling images...' &&
            docker compose -f $DOCKER_COMPOSE_FILE pull &&
            echo '[$(date -Iseconds)] Restarting...' &&
            docker compose -f $DOCKER_COMPOSE_FILE up -d &&
            echo '[$(date -Iseconds)] Cleaning...' &&
            docker image prune -f &&
            echo '[$(date -Iseconds)] Deploy complete.' &&
            docker compose -f $DOCKER_COMPOSE_FILE ps
          "
