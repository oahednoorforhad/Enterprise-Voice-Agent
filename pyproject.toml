[project]
name = "eva-backend"
version = "0.1.0"
description = "Enterprise Voice Assistant — evidence-based multi-source reasoning backend."
requires-python = ">=3.12,<3.13"
readme = "README.md"
authors = [{ name = "EVA Team" }]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    # Config
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.6",
    "alembic>=1.13.0",
    # LLM / Voice
    "google-genai>=1.0.0",
    # Observability
    "langfuse>=2.45.0",
    # HTTP
    "httpx>=0.27.0",
    # Logging / utilities
    "structlog>=24.1.0",
    "tenacity>=9.0.0",
    # Database (sync driver for Alembic)
    "psycopg[binary]>=3.2",
    # Data generation
    "faker>=25",
    "pytest>=9.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "testcontainers>=4.14.2",
]
